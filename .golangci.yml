version: "2"
run:
  tests: true
  build-tags:
    - integration
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    errcheck:
      # Failing to write CLI output to a closed terminal is not actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # unhandled errors are already reported by errcheck
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Build-time tools read and write repository files (and directories)
      # by design, with the usual repository permissions.
      - path: cmd/(schemagen|docgen)/
        linters: [gosec]
        text: "G301|G304|G306"
      # The store only concatenates "?" placeholder lists; values are always bound.
      - path: internal/store/
        linters: [gosec]
        text: G202
      # Tests plant fake credentials, convert the test process uid and
      # generate deterministic pseudo-random data.
      - path: _test\.go
        linters: [gosec]
        text: "G101|G115|G302|G304|G404|G703"
      # Test helpers generate deterministic pseudo-random archives.
      - path: internal/repo/repotest/
        linters: [gosec]
        text: "G115|G404"
formatters:
  enable:
    - gofmt
