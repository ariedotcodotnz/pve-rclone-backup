dir: local
	path /var/lib/vz
	content iso,vztmpl,backup

pbs: pbs1
	datastore main
	server 192.0.2.10
	content backup
	username backup@pbs

rclone-backup: offsite
	rclone-remote onedrive-main
	rclone-source homelab
	rclone-replicate-from local
	rclone-guests tagged
	rclone-tags offsite;critical
	rclone-exclude-vmids 105,106
	rclone-min-interval 7d
	content backup
	shared 1
	prune-backups keep-daily=7,keep-weekly=4
