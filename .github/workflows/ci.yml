name: ci

on:
  push:
    branches: [master]
  pull_request:
  # The release workflow runs the whole suite on a tagged commit first.
  workflow_call:
    inputs:
      deb-version:
        description: Debian version of the package; empty for a development version
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          test -z "$unformatted" || { echo "gofmt needed:"; echo "$unformatted"; exit 1; }
      - name: Generated code and reference pages are up to date
        run: |
          go run ./cmd/schemagen -root . -check
          go run ./cmd/docgen -root . -check
      - name: go vet
        run: make vet
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: unit tests (race)
        run: make race
      - name: integration tests
        run: make integration
      - name: build
        run: make build

  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Perl plugin tests (real PVE storage library, perl -T, real daemon)
        run: make perl-test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Build the package and install, use and purge it in the PVE container
        env:
          RELEASE_VERSION: ${{ inputs.deb-version }}
        run: make deb-test ${RELEASE_VERSION:+DEB_VERSION="$RELEASE_VERSION"}
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
