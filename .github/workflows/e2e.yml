name: e2e

# Installs Proxmox VE from the official ISO in a nested VM and runs the
# end-to-end suite (test/e2e). Too slow for every push.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-pve:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      E2E_DIR: /mnt/e2e
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Prepare the VM directory on the large disk
        run: sudo mkdir -p "$E2E_DIR" && sudo chown "$(id -u):$(id -g)" "$E2E_DIR"
      - name: Install and provision Proxmox VE
        run: test/e2e/vm.sh base
      - name: End-to-end tests
        run: make e2e
      - name: Console screenshot on failure
        if: failure()
        run: test/e2e/vm.sh screenshot || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-console
          path: ${{ env.E2E_DIR }}/screen.png
          if-no-files-found: ignore
